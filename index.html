    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var currentFetch = rawFetch ? rawFetch.bind(window) : rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && protoDesc.configurable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }
        } catch (e) {
          console.warn('Fetch setter safeguard error:', e);
        }
      })();
    </script>
